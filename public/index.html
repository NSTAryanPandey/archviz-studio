<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  REAL-WORLD SCALE: 1 unit = 1 metre. Lighting, shadows and the camera
//  only look "right" when sizes are physically plausible.
// =====================================================================
const W = 16, D = 12, H = 3, T = 0.2;   // house width, depth, ceiling height, exterior wall thickness
const EYE = 1.65, RADIUS = 0.28;        // eye height and body radius of the visitor

// Multiplayer state (filled in once connected; the game also works fully offline)
const net = { socket: null, online: false, myId: null, room: (new URLSearchParams(location.search).get('room') || 'house').slice(0, 40) };
let started = false;
const isTouch = matchMedia('(pointer: coarse)').matches || matchMedia('(hover: none)').matches;
const joy = { x: 0, y: 0, id: null, run: false };

const furnitureTypes = [
  { id: 'sofa',      name: 'Luxury Sofa',      icon: '🛋️' },
  { id: 'bed',       name: 'Master Bed',       icon: '🛏️' },
  { id: 'table',     name: 'Dining Table',     icon: '🪵' },
  { id: 'chair',     name: 'Modern Chair',     icon: '🪑' },
  { id: 'rug',       name: 'Designer Rug',     icon: '🟫' },
  { id: 'bookshelf', name: 'Bookshelf',        icon: '📚' },
  { id: 'tv',        name: 'Smart TV Unit',    icon: '📺' },
  { id: 'wall',      name: 'Partition Wall',   icon: '🧱' },
  { id: 'door',      name: 'Interior Door',    icon: '🚪' },
  { id: 'lamp',      name: 'Standing Lamp',    icon: '💡' },
  { id: 'fireplace', name: 'Modern Fireplace', icon: '🔥' },
  { id: 'armchair',  name: 'Lounge Chair',     icon: '💺' },
  { id: 'coffee',    name: 'Coffee Table',     icon: '☕' },
  { id: 'plant',     name: 'Potted Plant',     icon: '🪴' },
  { id: 'kitchen',   name: 'Kitchen Counter',  icon: '🍳' },
  { id: 'fridge',    name: 'Fridge',           icon: '🧊' },
  { id: 'island',    name: 'Kitchen Island',   icon: '🏝️' },
  { id: 'desk',      name: 'Study Desk',       icon: '🖥️' },
  { id: 'bathtub',   name: 'Bathtub',          icon: '🛁' },
  { id: 'toilet',    name: 'Toilet',           icon: '🚽' },
  { id: 'vanity',    name: 'Vanity + Mirror',  icon: '🪞' },
];

// Real scanned models from Poly Haven (CC0). Procedural versions are used until/unless these load.
const MODEL_SOURCES = {
  sofa:     { ph: 'sofa_03',                 fit: 2.2, by: 'width' },
  chair:    { ph: 'dining_chair_02',         fit: 0.5, by: 'width' },
  table:    { ph: 'dining_table',            fit: 1.8, by: 'width' },
  armchair: { ph: 'mid_century_lounge_chair', fit: 0.85, by: 'width' },
  coffee:   { ph: 'modern_coffee_table_01',  fit: 1.2, by: 'width' },
  plant:    { ph: 'pachira_aquatica_01',     fit: 1.4, by: 'height' },
};
const modelCache = {};

// ---------------------------------------------------------------- renderer
const pixelRatio = Math.min(window.devicePixelRatio, 1.5);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // applied by OutputPass
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 3000);
camera.position.set(-2.4, EYE, 0.2);
camera.lookAt(-5.5, 1.2, -3.2);

// ------------------------------------------------------------ look controls
// Works in two modes:
//  • Free cursor (default, works everywhere incl. iframes/previews): drag to look, click to place where the cursor points.
//  • Mouse-lock FPS mode (press F, only where the browser allows Pointer Lock): crosshair aiming.
const look = { yaw: 0, pitch: 0, locked: false, dragging: false, moved: 0, lockSupported: 'requestPointerLock' in Element.prototype };
{ const e0 = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); look.yaw = e0.y; look.pitch = e0.x; }
camera.rotation.order = 'YXZ';
function applyLook() { camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ'); }
function rotateBy(dx, dy, s) {
  look.yaw -= dx * s;
  look.pitch = THREE.MathUtils.clamp(look.pitch - dy * s, -1.45, 1.45);
  applyLook();
}
const mouseNDC = new THREE.Vector2(0, 0), mousePx = { x: 0, y: 0 };
let mouseOnCanvas = false;

// Image-based lighting: gives every PBR material something to reflect.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ================================================== procedural textures
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function valueNoise(seed) {
  const r = rng(seed), N = 256, p = new Float32Array(N * N);
  for (let i = 0; i < p.length; i++) p[i] = r();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) * N, y1 = ((yi + 1) & 255) * N;
    const a = p[y0 + x0], b = p[y0 + x1], c = p[y1 + x0], d = p[y1 + x1];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, oct = 4) { let v = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { v += a * n(x * f, y * f); norm += a; a *= 0.5; f *= 2; } return v / norm; }
function texFromData(data, w, h, srgb, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(data, w, h), 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function genTex(w, h, srgb, repeat, fn) {
  const d = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const [r, g, b] = fn(x, y); const i = (y * w + x) * 4;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
  }
  return texFromData(d, w, h, srgb, repeat);
}

// Oak plank floor: colour + roughness + bump, tileable, 1 tile = 2 m x 2 m.
function makeFloorTextures() {
  const S = 1024, n = valueNoise(7), r = rng(99);
  const col = new Uint8ClampedArray(S * S * 4), rough = new Uint8ClampedArray(S * S * 4), bump = new Uint8ClampedArray(S * S * 4);
  const rows = 10, ph = S / rows, plankLen = S / 2, rowOff = [], tones = {};
  for (let i = 0; i < rows; i++) rowOff.push(Math.floor(r() * S));
  const tone = (row, seg) => { const k = row * 100 + seg; if (tones[k] === undefined) tones[k] = r(); return tones[k]; };
  for (let y = 0; y < S; y++) {
    const row = Math.floor(y / ph), inRow = y - row * ph;
    for (let x = 0; x < S; x++) {
      const xx = (x + rowOff[row]) % S, seg = Math.floor(xx / plankLen), inSeg = xx - seg * plankLen;
      const t = tone(row, seg);
      const g = fbm(n, x * 0.25, y * 2 + row * 13, 4);
      const fine = n(x, y * 8);
      const ring = 0.5 + 0.5 * Math.sin(y * 0.35 + g * 18 + t * 20);
      const gap = inRow < 1.5 || inRow > ph - 1.5 || inSeg < 1.5 || inSeg > plankLen - 1.5;
      let k = (0.72 + 0.4 * t) * (0.8 + 0.24 * g + 0.08 * ring + 0.05 * fine);
      if (gap) k *= 0.35;
      const i = (y * S + x) * 4;
      col[i] = 150 * k; col[i + 1] = 104 * k; col[i + 2] = 66 * k; col[i + 3] = 255;
      const rv = gap ? 240 : 70 + 60 * g + 30 * fine;
      rough[i] = rough[i + 1] = rough[i + 2] = rv; rough[i + 3] = 255;
      const bv = gap ? 0 : 200 + 40 * g;
      bump[i] = bump[i + 1] = bump[i + 2] = bv; bump[i + 3] = 255;
    }
  }
  const rep = [W / 2, D / 2];
  return { map: texFromData(col, S, S, true, rep), rough: texFromData(rough, S, S, false, rep), bump: texFromData(bump, S, S, false, rep) };
}

const plasterN = valueNoise(3);
const plasterBump = genTex(512, 512, false, [3, 1], (x, y) => { const v = 120 + 110 * fbm(plasterN, x * 0.5, y * 0.5, 5); return [v, v, v]; });
const weaveN = valueNoise(11);
const weave = genTex(128, 128, false, [10, 10], (x, y) => {
  const over = (Math.floor(x / 4) + Math.floor(y / 4)) % 2;
  const v = over ? 0.55 + 0.45 * Math.sin(((y % 4) / 4) * Math.PI) : 0.55 + 0.45 * Math.sin(((x % 4) / 4) * Math.PI);
  const c = 255 * Math.min(1, v * (0.85 + 0.15 * weaveN(x * 2, y * 2))); return [c, c, c];
});
const grainN = valueNoise(21);
const grainTex = genTex(512, 512, true, [1, 1], (x, y) => {
  const g = fbm(grainN, x * 0.5, y * 4, 4);
  const ring = 0.5 + 0.5 * Math.sin(y * (Math.PI * 2 * 12 / 512) + g * 14);
  const k = 0.78 + 0.18 * g + 0.1 * ring; return [235 * k, 225 * k, 212 * k];
});
const tileN = valueNoise(17);
const tileTex = genTex(512, 512, true, [3.7, 4.1], (x, y) => {
  const grout = (x % 256) < 4 || (y % 256) < 4;

  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `

// ================================================================ placement
const placed = [], flickers = [];
const aabbOf = (obj) => { obj.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(obj); return { minX: b.min.x, maxX: b.max.x, minZ: b.min.z, maxZ: b.max.z }; };
const overlap = (a, b, m = 0.01) => a.minX < b.maxX - m && a.maxX > b.minX + m && a.minZ < b.maxZ - m && a.maxZ > b.minZ + m;

function isValid(obj, ignore = null) {
  const a = aabbOf(obj);
  if (a.minX < -W / 2 - 0.001 || a.maxX > W / 2 + 0.001 || a.minZ < -D / 2 - 0.001 || a.maxZ > D / 2 + 0.001) return false;
  if (STATIC_COLLIDERS.some(w => overlap(a, w))) return false;      // can't push things through walls
  if (obj.userData.walkable) return true;
  const p = camera.position;
  if (p.x > a.minX - RADIUS && p.x < a.maxX + RADIUS && p.z > a.minZ - RADIUS && p.z < a.maxZ + RADIUS) return false;
  return !placed.some(o => o !== ignore && !o.userData.walkable && overlap(a, o.userData.aabb));
}

// Local-only add. opts.netId = id shared with the server (or a temporary id while waiting for it).
function placeItem(id, x, z, rot, opts = {}) {
  const g = buildFurniture(id);
  g.position.set(x, 0, z); g.rotation.y = rot;
  g.userData.placedRoot = true;
  g.userData.netId = opts.netId || null;
  g.userData.uid = opts.uid || ++uidCounter;          // stable local handle (survives model swaps)
  g.userData.aabb = aabbOf(g);
  const spec = g.userData.lightSpec;
  if (spec) {
    const l = acquireLight(spec.shadow);
    if (l) { spec.anchor.getWorldPosition(l.position); l.color.set(spec.color); l.intensity = spec.intensity; g.userData.light = l; }
    else if (started) flashHint('Light limit reached: this one stays unlit', 2000);
  }
  if (g.userData.flames && g.userData.light) flickers.push(g);
  scene.add(g); placed.push(g);
  markSceneChanged();
  return g;
}

function removeItem(g) {
  if (!g || !placed.includes(g)) return;
  scene.remove(g);
  placed.splice(placed.indexOf(g), 1);
  const fi = flickers.indexOf(g); if (fi >= 0) flickers.splice(fi, 1);
  if (g.userData.light) releaseLight(g.userData.light);
  g.traverse(o => { if (o.isMesh && !o.userData.sharedGeo) o.geometry.dispose(); });
  markSceneChanged();
}

// User actions: change the room locally right away, then tell the server (if online).
// Each one is recorded in a personal undo history (Cmd/Ctrl+Z, Cmd/Ctrl+Shift+Z).
let tempCounter = 0, uidCounter = 0;

}

function userPlace(type, x, z, rot, { rec = true } = {}) {

  const g = placeItem(type, x, z, rot, { netId });
  if (net.online) net.socket.emit('place', { tempId: netId, type, x, z, rot, aabb: g.userData.aabb, walkable: !!g.userData.walkable });

}
function userRemove(g, { rec = true } = {}) {

}

// Apply a final position to an existing piece (used by drop, undo and redo)

// ---- carrying (moving) a piece of furniture
let carry = null;   // { g, from: {x,z,rot}, rot, valid, sendT }

function updateCarry(dt) {

  const g = carry.g;
  if (!placed.includes(g)) { carry = null; carryMarker.visible = false; updateTouchLabels(); return; }   // deleted by someone/something
  raycaster.setFromCamera(aim(), camera);

// ---- undo / redo
function applyAction(a, undo) {
  const fail = (why) => { flashHint(`Can't ${undo ? 'undo' : 'redo'}: ${why}`, 2000); return false; };
  if (a.kind === 'place' || a.kind === 'remove') {
    const shouldExist = (a.kind === 'place') !== undo;    // undo place → remove it; undo remove → bring it back
    if (shouldExist) {
      const g = userPlace(a.snap.type, a.snap.x, a.snap.z, a.snap.rot, { rec: false });
      if (!isValid(g, g)) { /* placed anyway: it was valid when recorded */ }
      a.uid = g.userData.uid;
    } else {
      const g = byUid(a.uid);
      if (!g) return fail('someone already removed it');
      a.snap = snapOf(g);
      if (!userRemove(g, { rec: false })) return false;
    }
  } else if (a.kind === 'move') {
    const g = byUid(a.uid);
    if (!g) return fail('that piece was removed');
    if (g.userData.lockedBy) return fail(`${g.userData.lockedBy} is moving it`);
    const target = undo ? a.from : a.to;
    const before = snapOf(g);
    g.position.set(target.x, 0, target.z); g.rotation.y = target.rot;
    if (!isValid(g, g)) { g.position.set(before.x, 0, before.z); g.rotation.y = before.rot; return fail('something is in the way now'); }
    commitMove(g, target);
  } else if (a.kind === 'clear') {
    if (undo) { a.uids = a.snaps.map(sn => userPlace(sn.type, sn.x, sn.z, sn.rot, { rec: false }).userData.uid); }
    else { a.snaps = placed.map(snapOf); if (net.online) net.socket.emit('clear'); [...placed].forEach(removeItem); }
  }
  return true;
}

  const a = undoStack.pop(); if (!a) { flashHint('Nothing to undo', 900); return; }
  if (applyAction(a, true)) { redoStack.push(a); flashHint('↶ Undone', 700); }
  updateUndoUI();
}
function redo() {
  const a = redoStack.pop(); if (!a) { flashHint('Nothing to redo', 900); return; }
  if (applyAction(a, false)) { undoStack.push(a); flashHint('↷ Redone', 700); }
  updateUndoUI();
}
function updateUndoUI() {
  const u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo');
  if (u) u.style.opacity = undoStack.length ? 1 : 0.4;
  if (r) r.style.opacity = redoStack.length ? 1 : 0.4;
}

  if (pl) pl.textContent = carry ? '✔ Drop' : '＋ Place';
  if (mv) mv.textContent = carry ? '✖' : '✋';
}

// ---------------------------------------------------------------- real models
async function loadPolyHaven(type, src) {
  const res = await fetch(`https://api.polyhaven.com/files/${src.ph}`);
  if (!res.ok) throw new Error('api ' + res.status);
  const files = await res.json();
  const g = files.gltf['1k'].gltf;
  const includes = g.include || {};
  // The .gltf references its .bin and textures by relative path; point those at Poly Haven's real URLs.
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => { for (const rel in includes) if (url.endsWith(rel)) return includes[rel].url; return url; });
  const gltf = await new GLTFLoader(manager).loadAsync(g.url);
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.userData.sharedGeo = true; } });
  // Normalise: centre on X/Z, sit on the floor, fix scale only if it is clearly in the wrong units.
  let box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
  const measured = src.by === 'height' ? size.y : Math.max(size.x, size.z);
  const ratio = src.fit / measured;
  if (ratio < 0.6 || ratio > 1.6) model.scale.multiplyScalar(ratio);
  box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x; model.position.z -= c.z; model.position.y -= box.min.y;
  const tpl = new THREE.Group(); tpl.add(model);
  modelCache[type] = tpl;
  // Swap any procedural stand-ins already in the room
  for (const o of placed.filter(p => p.userData.id === type)) {
    const { x, z } = o.position, r = o.rotation.y, netId = o.userData.netId;
    const uid = o.userData.uid, lockedBy = o.userData.lockedBy, wasCarried = carry && carry.g === o;
    removeItem(o); const ng = placeItem(type, x, z, r, { netId, uid }); ng.userData.lockedBy = lockedBy;
    if (wasCarried) { carry.g = ng; ng.position.y = 0.04; }
  }
  if (furnitureTypes[selected].id === type) rebuildGhost();
}
function loadModels() {
  for (const [type, src] of Object.entries(MODEL_SOURCES)) {
    loadPolyHaven(type, src).catch(err => console.warn(`Model ${src.ph} unavailable, keeping procedural ${type}:`, err.message));
  }
}

// Ghost preview that follows the crosshair
let selected = 0, rotation = 0, ghost = null, ghostValid = false;
function rebuildGhost() {

  ghostValid = true;

  lights.forEach(l => l.parent.remove(l));

}
const raycaster = new THREE.Raycaster(), center = new THREE.Vector2(0, 0);

// ================================================================ movement
const keys = {}, vel = new THREE.Vector3(), wish = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
let bobT = 0;
function blocked(x, z) {
  if (x < -W / 2 + RADIUS || x > W / 2 - RADIUS || z < -D / 2 + RADIUS || z > D / 2 - RADIUS) return true;
  for (const c of STATIC_COLLIDERS) if (x > c.minX - RADIUS && x < c.maxX + RADIUS && z > c.minZ - RADIUS && z < c.maxZ + RADIUS) return true;
  for (const o of placed) {
    if (o.userData.walkable || (carry && o === carry.g)) continue;
    const c = o.userData.aabb;

  const r = active ? THREE.MathUtils.clamp((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x, -1, 1) : 0;
  const speed = keys.ShiftLeft || keys.ShiftRight ? 4.5 : 2.4;

  const turn = active ? (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0) : 0;

  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();     // walk on the floor, never fly

  camera.position.z = THREE.MathUtils.clamp(camera.position.z, -D / 2 + RADIUS, D / 2 - RADIUS);

let tod = 0, todTarget = 0, rainMix = 0, rainTarget = 0, baseExposure = 1.0;
const sstep = (x, a, b) => THREE.MathUtils.smoothstep(x, a, b);
function applyLighting() {
  const elev = THREE.MathUtils.lerp(28, -10, tod);
  const dir = sunSpherical(elev, 200);
  skyU.sunPosition.value.copy(dir);
  skyU.turbidity.value = THREE.MathUtils.lerp(2.2, 10, rainMix);
  skyU.rayleigh.value = THREE.MathUtils.lerp(1.0, 2.6, rainMix);
  skyU.mieCoefficient.value = THREE.MathUtils.lerp(0.004, 0.02, rainMix);
  const dayK = sstep(elev, -4, 8);
  const gloom = 1 - 0.85 * rainMix;
  sunLight.position.copy(dir).multiplyScalar(30);
  sunLight.intensity = 3.4 * dayK * gloom;
  sunLight.color.copy(warmLow).lerp(warmHigh, sstep(elev, 2, 25));
  // Before the first room snapshot exists, use the generic studio environment scaled by daylight.
  // Afterwards the snapshot already contains day/night, so it gets a constant strength.
  if (probeCaptures === 0) {
    hemiLight.intensity = 0.04 + 0.32 * dayK * (1 - 0.4 * rainMix);
    scene.environmentIntensity = 0.04 + 0.5 * dayK * (1 - 0.45 * rainMix);
  } else {
    hemiLight.intensity = 0.02 + 0.15 * dayK * (1 - 0.4 * rainMix);

  }
  windowLights.forEach(l => { l.intensity = 5 * l.userData.k * dayK * (1 - 0.55 * rainMix); l.color.setHex(0xdfe9ff).lerp(GREY_SKY, rainMix); });
  const lightsOn = Math.max(1 - dayK, rainMix * 0.5);
  downlights.forEach(s => s.intensity = 11 * lightsOn);
  MAT.downlight.emissiveIntensity = 0.3 + 10 * lightsOn;
  buildingMats.forEach(m => m.emissiveIntensity = 1.4 * (1 - dayK));
  dustMat.opacity = 0.2 * dayK * (1 - rainMix);
  rainMat.uniforms.uOpacity.value = 0.4 * rainMix; rain.visible = rainMix > 0.01;

}

function updateDust(t, dt) {
  if (dustMat.opacity < 0.005) return;
  const p = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    const k = i * 3;
    p[k] += Math.cos(t * 0.2 + i * 1.3) * 0.03 * dt;
    p[k + 1] += Math.sin(t * 0.3 + i) * 0.02 * dt;

}
function updateFlicker(t) {

// ================================================================ touch controls
// Left: virtual joystick (walk). Anywhere else: one finger = look, two fingers = pinch zoom.
// Buttons: Place / Rotate / Delete act on whatever the centre dot points at.
function setupTouch() {
  document.body.classList.add('touch');
  const pad = document.getElementById('joy'), knob = document.getElementById('joy-knob');
  const R = 46;
  const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px, ${dy}px)`; };
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); joy.id = e.pointerId; pad.setPointerCapture(e.pointerId); moveJoy(e); });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === joy.id) moveJoy(e); });
  const endJoy = (e) => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; joy.run = false; setKnob(0, 0); };
  pad.addEventListener('pointerup', endJoy); pad.addEventListener('pointercancel', endJoy);
  function moveJoy(e) {
    const rect = pad.getBoundingClientRect();
    let dx = e.clientX - (rect.left + rect.width / 2), dy = e.clientY - (rect.top + rect.height / 2);
    const len = Math.hypot(dx, dy);
    joy.run = len > R * 1.25;                                  // push past the edge to run
    if (len > R) { dx *= R / len; dy *= R / len; }
    joy.x = dx / R; joy.y = dy / R; setKnob(dx, dy);
  }

  const cv = renderer.domElement;
  let lookId = null, last = null, pinchDist = null;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  cv.addEventListener('touchstart', (e) => {
    e.preventDefault();                                        // also stops fake mouse clicks
    if (e.touches.length >= 2) { pinchDist = dist(e.touches); lookId = null; return; }
    const t = e.changedTouches[0]; lookId = t.identifier; last = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  cv.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length >= 2 && pinchDist) {
      const d = dist(e.touches);
      camera.fov = THREE.MathUtils.clamp(camera.fov - (d - pinchDist) * 0.08, 30, 75); camera.updateProjectionMatrix();
      pinchDist = d; return;

      rotateBy(t.clientX - last.x, t.clientY - last.y, 0.0055 * invertLook);

    }

  const endTouch = (e) => {
    for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
    if (e.touches.length < 2) pinchDist = null;
  };

  const tap = (id, fn) => document.getElementById(id).addEventListener('click', (e) => { e.preventDefault(); if (started) fn(); });
  tap('t-move', () => { if (carry) cancelCarry(); else if (hovered) pickUp(hovered); else flashHint('Aim the dot at a piece of furniture', 1500); });
  tap('t-place', () => {

  });
  tap('t-rot', () => { if (carry) carry.rot += Math.PI / 4; else rotation += Math.PI / 4; });
  tap('t-del', () => { if (carry) { userRemove(carry.g); return; } if (hovered) { userRemove(hovered); if (navigator.vibrate) navigator.vibrate(25); } else flashHint('Aim the dot at a piece of furniture', 1500); });
}

// Procedural boy / girl characters. Built from simple parts so arms, legs and head can animate.
// Everything faces −Z (the direction the camera looks at yaw 0).
const SKIN = 0xc98d66, HAIR = 0x1c130e;

  const k = girl ? 0.95 : 1;                                     // girls slightly shorter
  const g = new THREE.Group(), body = new THREE.Group(); body.scale.setScalar(k); g.add(body);
  const M = (c, r = 0.6, extra = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: r, ...extra });
  const skin = M(SKIN, 0.55, { sheen: 0.3 }), hair = M(HAIR, 0.45, { sheen: 1, sheenColor: 0x6b4a3a });
  const top = M(outfit, 0.8, { sheen: 0.6 }), pants = M(girl ? SKIN : 0x2b3a55, girl ? 0.55 : 0.85), shoe = M(girl ? 0xf5f5f5 : 0x1f2937, 0.5);
  const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };

  // Legs (pivot at the hip so they can swing)
  const legs = [];
  for (const sx of [-0.095, 0.095]) {
    const leg = new THREE.Group(); leg.position.set(sx, 0.9, 0);
    leg.add(mesh(new THREE.CapsuleGeometry(girl ? 0.062 : 0.075, 0.72, 4, 12), pants, 0, -0.43, 0));
    leg.add(mesh(new RoundedBoxGeometry(0.11, 0.07, 0.26, 2, 0.03), shoe, 0, -0.86, -0.04));
    body.add(leg); legs.push(leg);
  }
  // Hips + torso
  body.add(mesh(new RoundedBoxGeometry(girl ? 0.3 : 0.34, 0.18, 0.2, 2, 0.06), girl ? top : pants, 0, 0.95, 0));
  if (girl) {                                                    // flared skirt
    const skirt = mesh(new THREE.CylinderGeometry(0.17, 0.3, 0.36, 28, 1, true), new THREE.MeshPhysicalMaterial({ color: outfit, roughness: 0.75, sheen: 0.6, side: THREE.DoubleSide }), 0, 0.78, 0);
    body.add(skirt);
  }
  body.add(mesh(new RoundedBoxGeometry(girl ? 0.32 : 0.4, 0.52, 0.21, 3, 0.08), top, 0, 1.27, 0));
  body.add(mesh(new THREE.CylinderGeometry(0.048, 0.055, 0.1, 16), skin, 0, 1.56, 0));
  // Arms (pivot at the shoulder)
  const arms = [];
  for (const sx of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(sx * (girl ? 0.2 : 0.24), 1.47, 0); arm.rotation.z = sx * 0.06;
    arm.add(mesh(new THREE.CapsuleGeometry(girl ? 0.044 : 0.052, 0.48, 4, 12), top, 0, -0.29, 0));
    arm.add(mesh(new THREE.SphereGeometry(girl ? 0.04 : 0.045, 16, 12), skin, 0, -0.6, 0));
    body.add(arm); arms.push(arm);
  }
  // Head (pivot at the neck so it can nod with where the player looks)
  const head = new THREE.Group(); head.position.set(0, 1.6, 0); body.add(head);
  const face = mesh(new THREE.SphereGeometry(0.12, 32, 24), skin, 0, 0.1, 0); face.scale.set(1, 1.12, 1.02); head.add(face);
  const eyeMat = M(0x111111, 0.2);
  for (const ex of [-0.042, 0.042]) head.add(mesh(new THREE.SphereGeometry(0.014, 12, 8), eyeMat, ex, 0.115, -0.112));
  head.add(mesh(new THREE.SphereGeometry(0.018, 12, 8), skin, 0, 0.085, -0.122));            // nose
  // Hair cap: a partial sphere tilted back so the forehead and eyes stay visible
  const cap = mesh(new THREE.SphereGeometry(girl ? 0.134 : 0.13, 32, 16, 0, Math.PI * 2, 0, Math.PI * (girl ? 0.56 : 0.5)), hair, 0, girl ? 0.115 : 0.12, 0.008);
  cap.rotation.x = girl ? 0.45 : 0.5; head.add(cap);
  if (girl) {                                                    // long hair down the back + side strands
    head.add(mesh(new RoundedBoxGeometry(0.25, 0.42, 0.09, 3, 0.04), hair, 0, -0.04, 0.075));
    for (const hx of [-0.115, 0.115]) head.add(mesh(new RoundedBoxGeometry(0.05, 0.3, 0.1, 2, 0.02), hair, hx, 0.0, 0.0));
  }
  g.userData.parts = { legs, arms, head };
  g.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = true; } });
  return g;
}

function addPlayer(p) {
  if (players.has(p.id)) return;
  const g = makeCharacter(p.avatar, p.color);
  const tag = makeNameTag(`${p.avatar === 'girl' ? '👧' : '👦'} ${p.name}`, p.color);
  tag.position.y = p.avatar === 'girl' ? 1.95 : 2.02;
  g.add(tag); g.userData.tag = tag;
  g.position.set(p.x || 0, 0, p.z || 0); g.rotation.y = p.yaw || 0;
  avatarGroup.add(g);
  players.set(p.id, { name: p.name, color: p.color, avatar: p.avatar, group: g, walk: 0, phase: 0,
    target: { x: p.x || 0, z: p.z || 0, yaw: p.yaw || 0, pitch: p.pitch || 0 } });
}
function removePlayer(id) {
  const p = players.get(id); if (!p) return;
  avatarGroup.remove(p.group);
  p.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  players.delete(id);
}
// Network updates arrive ~12×/s; glide toward them every frame so movement looks smooth.
function updateAvatars(dt) {
  const k = 1 - Math.exp(-12 * dt);
  const t = clock.elapsedTime;
  players.forEach(p => {
    const g = p.group;
    const ox = g.position.x, oz = g.position.z;
    g.position.x += (p.target.x - g.position.x) * k;
    g.position.z += (p.target.z - g.position.z) * k;
    let dy = p.target.yaw - g.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy));   // shortest turn
    g.rotation.y += dy * k;
    // Walk cycle driven by how fast the avatar is actually moving
    const speed = dt > 0 ? Math.hypot(g.position.x - ox, g.position.z - oz) / dt : 0;
    p.walk += (Math.min(speed / 2.4, 1.4) - p.walk) * (1 - Math.exp(-8 * dt));
    p.phase += dt * (2 + speed * 3.2);
    const { legs, arms, head } = g.userData.parts, sw = Math.sin(p.phase) * p.walk;
    legs[0].rotation.x = sw * 0.6; legs[1].rotation.x = -sw * 0.6;
    arms[0].rotation.x = -sw * 0.5 + Math.sin(t * 1.6) * 0.03; arms[1].rotation.x = sw * 0.5 - Math.sin(t * 1.6) * 0.03;
    g.children[0].position.y = Math.abs(Math.sin(p.phase)) * 0.03 * p.walk;               // slight bounce
    head.rotation.x += (THREE.MathUtils.clamp(p.target.pitch || 0, -0.8, 0.8) * 0.7 - head.rotation.x) * k;
  });
}

function connectNet() {
  if (typeof io === 'undefined') { setNetStatus(); return; }    // opened as a plain file → single-player
  const socket = io({ transports: ['websocket', 'polling'] });
  net.socket = socket; setNetStatus();
  socket.on('connect', () => socket.emit('join', { room: net.room, name: myName, color: myColor, avatar: myAvatar }));
  socket.on('disconnect', () => { net.online = false; setNetStatus(); [...players.keys()].forEach(removePlayer); });
  socket.on('init', ({ you, objects, players: list, env }) => {
    net.online = true; net.myId = you;
    [...placed].forEach(removeItem);                         // the server's room is the truth
    if (carry) cancelCarry(false);
    undoStack.length = 0; redoStack.length = 0; updateUndoUI();
    if (objects.length) objects.forEach(o => { const g = placeItem(o.type, o.x, o.z, o.rot, { netId: o.id }); g.userData.lockedBy = o.lockName || null; });
    else stageRoom();                                        // first visitor furnishes the empty room
    [...players.keys()].forEach(removePlayer);
    list.forEach(p => { if (p.id !== you) addPlayer(p); });
    applyRemoteEnv(env);
    setNetStatus();
    flashHint(`Connected to room "${net.room}"`, 2000);
  });
  socket.on('placed', ({ item, tempId }) => {
    const mine = tempId && placed.find(o => o.userData.netId === tempId);
    if (mine) { mine.userData.netId = item.id; return; }  // our own placement confirmed
    if (!placed.some(o => o.userData.netId === item.id)) placeItem(item.type, item.x, item.z, item.rot, { netId: item.id });
  });
  socket.on('rejected', ({ tempId, reason }) => {
    removeItem(placed.find(o => o.userData.netId === tempId));
    flashHint(`Server rejected that placement: ${reason}`, 2000);
  });
  socket.on('removed', ({ id }) => removeItem(placed.find(o => o.userData.netId === id)));
  socket.on('cleared', () => { if (carry) cancelCarry(false); [...placed].forEach(removeItem); });
  const byNet = (id) => placed.find(o => o.userData.netId === id);
  const remoteDrags = net.remoteDrags = new Map();
  socket.on('locked', ({ id, name }) => { const g = byNet(id); if (g) g.userData.lockedBy = name; });
  socket.on('lockDenied', ({ id, name }) => {
    if (carry && carry.g.userData.netId === id) cancelCarry(false);
    flashHint(name ? `🔒 ${name} is moving that` : 'That piece no longer exists', 1800);
  });
  socket.on('dragged', ({ id, x, z, rot }) => { const g = byNet(id); if (g) remoteDrags.set(id, { g, x, z, rot }); });
  const settle = (id, x, z, rot, aabb) => {
    remoteDrags.delete(id);
    const g = byNet(id); if (!g || (carry && carry.g === g)) return;
    g.userData.lockedBy = null;
    g.position.set(x, 0, z); g.rotation.y = rot; g.userData.aabb = aabb || aabbOf(g); syncLight(g); markSceneChanged();
  };
  socket.on('objMoved', ({ id, x, z, rot, aabb }) => settle(id, x, z, rot, aabb));
  socket.on('unlocked', ({ id, x, z, rot }) => settle(id, x, z, rot));
  socket.on('objMoveRejected', ({ id, x, z, rot, reason }) => {
    const g = byNet(id); if (g) { g.position.set(x, 0, z); g.rotation.y = rot; g.userData.aabb = aabbOf(g); syncLight(g); markSceneChanged(); }
    flashHint(`Server put it back: ${reason}`, 2000);
  });
  socket.on('env', applyRemoteEnv);
  socket.on('playerJoined', (p) => { addPlayer(p); setNetStatus(); flashHint(`${p.name} joined`, 1800); });
  socket.on('playerLeft', ({ id }) => { const p = players.get(id); removePlayer(id); setNetStatus(); if (p) flashHint(`${p.name} left`, 1800); });
  socket.on('playerMoved', ({ id, x, z, yaw, pitch }) => { const p = players.get(id); if (p) Object.assign(p.target, { x, z, yaw, pitch }); });
}

buildInventoryUI();
rebuildGhost();

// ================================================================ loop
const clock = new THREE.Clock();
let fpsFrames = 0, fpsTime = 0, fpsAccum = [], autoQuality = true, sendTimer = 0, focusDist = 3;
const lastSent = { x: 0, z: 0, yaw: 0, pitch: 0 };
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp: no teleporting after a tab switch
  const t = clock.elapsedTime;
  const transitioning = Math.abs(todTarget - tod) > 0.002 || Math.abs(rainTarget - rainMix) > 0.002;
  tod += (todTarget - tod) * (1 - Math.exp(-1.2 * dt));
  rainMix += (rainTarget - rainMix) * (1 - Math.exp(-1.2 * dt));
  updateMovement(dt);
  updateGhost();
  updateHover();
  applyLighting();
  updateRain(t);
  updateDust(t, dt);
  updateFlicker(t);
  updateAvatars(dt);
  updateCarry(dt);
  if (net.remoteDrags) net.remoteDrags.forEach((d) => {                  // others moving furniture: glide it
    const g = d.g, k = 1 - Math.exp(-14 * dt);
    if (!placed.includes(g)) return;
    g.position.x += (d.x - g.position.x) * k; g.position.z += (d.z - g.position.z) * k; g.position.y = 0.04;
    let dr = d.rot - g.rotation.y; g.rotation.y += Math.atan2(Math.sin(dr), Math.cos(dr)) * k;
    syncLight(g); shadowsDirty = true;
  });
  lensPass.uniforms.uTime.value = t;

  // Shadows + reflection snapshot only when needed (the sun moves during day/night transitions)
  if (transitioning) { shadowsDirty = true; if (probeTimer <= 0) probeTimer = 0.4; }
  flushShadows();
  if (probeTimer > 0) { probeTimer -= dt; if (probeTimer <= 0) { captureProbe(); if (probeCaptures < 2) probeTimer = 0.3; } }

  // Photo-mode depth of field: focus on whatever you're aiming at
  if (bokehPass.enabled) {
    raycaster.setFromCamera(aim(), camera);
    const hit = raycaster.intersectObjects(scene.children.filter(o => o !== sky && o !== rain && o !== dust && o !== ghost), true)[0];
    focusDist += ((hit ? hit.distance : 6) - focusDist) * (1 - Math.exp(-8 * dt));
    bokehPass.uniforms.focus.value = focusDist;
  }

  composer.render();
  if (wantScreenshot) {                     // grab the frame right after rendering it
    wantScreenshot = false;
    const a = document.createElement('a');
    a.download = `archviz_${Date.now()}.png`; a.href = renderer.domElement.toDataURL('image/png'); a.click();
    flashHint('Screenshot saved', 1500);
  }

  // FPS counter + automatic quality: drop a preset if we stay below target for ~4 s
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    const fps = fpsFrames / fpsTime; fpsFrames = 0; fpsTime = 0;
    fpsLabel.textContent = `${Math.round(fps)} fps · ${QUALITY[qIndex].name}`;
    if (started && autoQuality && !document.hidden) {
      fpsAccum.push(fps); if (fpsAccum.length > 8) fpsAccum.shift();
      const avg = fpsAccum.reduce((a, b) => a + b, 0) / fpsAccum.length;
      if (fpsAccum.length === 8 && avg < 40 && qIndex < QUALITY.length - 1) { applyQuality(qIndex + 1); fpsAccum = []; flashHint(`Switched to ${QUALITY[qIndex].name} quality for smoother FPS (Q to change)`, 2500); }
    }
  }

  // Multiplayer: send our position ~12×/s, only if it changed
  sendTimer += dt;
  if (net.online && sendTimer > 1 / 12) {
    sendTimer = 0;
    const p = camera.position;
    if (Math.abs(p.x - lastSent.x) + Math.abs(p.z - lastSent.z) + Math.abs(look.yaw - lastSent.yaw) + Math.abs(look.pitch - lastSent.pitch) > 0.002) {
      Object.assign(lastSent, { x: p.x, z: p.z, yaw: look.yaw, pitch: look.pitch });
      net.socket.volatile.emit('move', lastSent);
    }
  }
});
// Scanned herringbone parquet from Poly Haven (CC0); keeps the procedural oak floor if it can't load
function loadFloorTextures() {
  const id = 'herringbone_parquet', base = `https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/${id}/${id}_`;
  const tl = new THREE.TextureLoader(); tl.setCrossOrigin('anonymous');
  Promise.all(['diff', 'nor_gl', 'rough'].map(k => tl.loadAsync(`${base}${k}_2k.jpg`))).then(([diff, nor, rough]) => {
    for (const t of [diff, nor, rough]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(W / 2, D / 2); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
    diff.colorSpace = THREE.SRGBColorSpace;
    Object.assign(MAT.floor, { map: diff, normalMap: nor, roughnessMap: rough, bumpMap: null, roughness: 1 });
    MAT.floor.needsUpdate = true;
    markSceneChanged();
  }).catch(e => console.warn('Floor textures unavailable, keeping procedural floor:', e && e.message));
}
loadModels();
loadFloorTextures();
